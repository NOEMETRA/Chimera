name: Chimera fixture integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files without executing receiver
        run: python -m py_compile c2_server.py make_svg.py
      - name: Parse standalone JavaScript
        run: node --check script.js
      - name: Check positive and safe-negative fixtures
        run: python -m unittest discover -s tests -v
